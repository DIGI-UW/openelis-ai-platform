version: '2.4'

services:

  app:
    image : itechuw/rag-app:latest
    container_name : rag_app
    ports:
      - "8282:8080"
    environment:
      - DB_URL=${DB_URL}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-demoKey}
      - CHATWINDOW=${CHATWINDOW}
      - FHIR_DB_TABLES_META=${FHIR_DB_TABLES_META}
      - APP_PGVECTOR_HOST=${APP_PGVECTOR_HOST}
      - APP_PGVECTOR_PORT=${APP_PGVECTOR_PORT}
      - APP_PGVECTOR_DATABASE=${APP_PGVECTOR_DATABASE}
      - APP_PGVECTOR_USER=${APP_PGVECTOR_USER}
      - APP_PGVECTOR_PASSWORD=${APP_PGVECTOR_PASSWORD}
      - APP_PGVECTOR_TABLE=${APP_PGVECTOR_TABLE}
    depends_on:
      spark:
        condition: service_healthy

  pgvector:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    container_name: pgvector
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: LocalPasswordOnly
    ports:
      - "5432:5432"
  ollama:
    image: itechuw/ollama:latest
    container_name: ollama_app
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  pipeline-controller:
    image: us-docker.pkg.dev/cloud-build-fhir/fhir-analytics/main:latest
    container_name: pipeline-controller
    volumes:
      - ${PIPELINE_CONFIG}:/app/config:ro
      - ${DWH_ROOT}:/dwh
    environment:
      - JAVA_OPTS=$JAVA_OPTS
    ports:
      - '8090:8080'
    networks:
      - default
    depends_on:
      spark:
        condition: service_healthy

  spark:
    image: docker.io/bitnami/spark:3.3
    container_name: spark-thriftserver
    command:
      - sbin/start-thriftserver.sh
      - --driver-memory
      # You may need to increase this if your queries/data are too large.
      - 5g
    environment:
      - HIVE_SERVER2_THRIFT_PORT=10000
    ports:
      - '10001:10000'
      - '4041:4040'
    volumes:
      - ${DWH_ROOT}:/dwh
      # NON-EMBEDDED METASTORE CONFIG:
      # If you want to persist the Metastore data, e.g., table and view
      # definitions, you can use an external database by adjusting hive-site.xml
      #- ./hive-site_example.xml:/opt/bitnami/spark/conf/hive-site.xml
      # Note to use an external DB, you need to provide its driver jar too:
      #- ./postgresql-42.6.0.jar:/opt/bitnami/spark/jars/postgresql-42.6.0.jar
      - spark_vol_single:/opt/bitnami/spark
    networks:
      - default
    healthcheck:
      test: beeline help || exit 1
      interval: 10s
      retries: 10
      start_period: 5s
      timeout: 60s


volumes:
  spark_vol_single:
  ollama_data:
  postgres-data:

